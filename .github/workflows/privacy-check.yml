name: Privacy and identity check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject personal identifiers and invalid commit identities
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            commit_range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              commit_range="$(git merge-base origin/main HEAD)..HEAD"
            else
              commit_range="$before..HEAD"
            fi
          fi
          test -z "$(git log --no-merges --format='%an <%ae>%n%cn <%ce>' "$commit_range" | grep -Ev '^AcademicContributor <academic-contributor@users\.noreply\.github\.com>$' || true)"
          files=$(git ls-files | grep -Ev '(^|/)(AGENTS|GEMINI)\.md$|^\.githooks/|^\.github/workflows/privacy-check\.yml$' || true)
          if [ -n "$files" ] && printf '%s\n' "$files" | xargs grep -n -I -E '(^|/)(home|Users)/[^/ ]+|ractopen|ryme|197402134|slmails\.com|file:///|BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY'; then
            exit 1
          fi
